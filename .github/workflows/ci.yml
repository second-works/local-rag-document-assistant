name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck application
        run: npm run typecheck
      - name: Typecheck Worker bindings
        run: npm run worker:typecheck
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Set up Python for PDF fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF fixture dependencies
        run: python -m pip install -r requirements-demo-pdf.txt
      - name: Generate and stage PDF fixtures
        run: |
          python scripts/generate-demo-pdfs.py
          python scripts/stage-demo-r2.py
